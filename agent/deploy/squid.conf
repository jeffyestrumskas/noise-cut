# Only these destinations get out (run.sh writes the acl files from the .env files each run):
#   https-hosts  HTTPS (CONNECT to 443): the Elasticsearch and Kibana hosts, and ollama.com if used
#   http-hosts + http-port   plain HTTP: a local Ollama (OLLAMA_HOST=http://...), else a placeholder
http_port 3128
acl https_hosts dstdomain "/etc/squid/acl/https-hosts"
acl plain_hosts dstdomain "/etc/squid/acl/http-hosts"
acl plain_port port "/etc/squid/acl/http-port"
acl https port 443
acl CONNECT method CONNECT
http_access allow CONNECT https https_hosts
http_access allow !CONNECT plain_hosts plain_port
http_access deny all
cache deny all
# squid runs as "proxy", which cannot open /dev/stdout. Not access.log: the image links that to
# /dev/stdout, so "cat access.log" waits forever. run.sh copies this file out before each restart.
access_log stdio:/var/log/squid/noise-access.log
pid_filename none
