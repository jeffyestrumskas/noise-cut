# noise-agent in containers. Run with deploy/run.sh, which gives each step only what it needs:
#   NOISE_CODE    a copy of just the files that step runs (nothing else of the repo is visible)
#   NOISE_SECRET  a settings file with just the keys that step uses
#   NOISE_ACL     the hosts the proxy lets that step reach
# The containers sit on an internal network; their only way out is the squid proxy.

x-step: &step
  image: python:3.12-slim@sha256:05cda9777409a9c3ffddd94a4c476b79f0769a0b4857f0c7ed9226b6800b0d6f
  user: "${NOISE_UID}:${NOISE_GID}"   # your user (to read the 0600 settings file), never root
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 64
  mem_limit: 512m
  networks: [jail]
  environment:
    HTTPS_PROXY: http://proxy:3128
    HTTP_PROXY: http://proxy:3128        # for a local http:// Ollama
    NOISE_CUT_STATE: /state
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"               # progress shows up live
    HOME: /tmp
  volumes:
    - ${NOISE_CODE}:/app:ro
    - ${NOISE_SECRET}:/config/settings.env:ro
    - ${NOISE_RUN}:/out

services:
  proxy:
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    volumes:
      - ./squid.conf:/etc/squid/squid.conf:ro
      - ${NOISE_ACL}:/etc/squid/acl:ro
    networks: [jail, egress]

  rows:                                # no model: the noisiest rows, read-only key
    <<: *step
    volumes:
      - ${NOISE_CODE}:/app:ro
      - ${NOISE_SECRET}:/config/settings.env:ro
      - ${NOISE_RUN}:/out
      - ${NOISE_STATE}:/state          # record of existing filters, shared with runs by hand
    command: [python3, /app/agent/noise-pipeline.py, rows, --out, /out, --env-file, /config/settings.env]

  propose:                             # model 1, read-only tools, read-only key
    <<: *step
    command: [python3, /app/agent/noise-agent.py, propose, --out, /out, --env-file, /config/settings.env]

  validate:                            # model 2, read-only tools, read-only key
    <<: *step
    command: [python3, /app/agent/noise-agent.py, validate, --out, /out, --env-file, /config/settings.env]

  apply-dry-run:                       # no model, read-only key, no code that writes
    <<: *step
    command: [python3, /app/agent/noise-pipeline.py, apply, --dry-run, --out, /out, --env-file, /config/settings.env]

  apply:                               # no model: creates what passed validate and the code checks
    <<: *step
    volumes:
      - ${NOISE_CODE}:/app:ro
      - ${NOISE_SECRET}:/config/settings.env:ro
      - ${NOISE_RUN}:/out
      - ${NOISE_STATE}:/state          # record of existing filters, shared with runs by hand
    command: [python3, /app/agent/noise-pipeline.py, apply, --out, /out, --env-file, /config/settings.env]

networks:
  jail: {internal: true}
  egress: {}
